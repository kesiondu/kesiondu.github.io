<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#132b27">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="header wrap">
    <a class="brand" href="{{ '/' | relative_url }}">K<span class="brand-name">Kesion Journal</span></a>
    <nav aria-label="主导航"><a href="{{ '/#notes' | relative_url }}">文章</a><a href="{{ '/projects/' | relative_url }}">项目</a><a href="{{ '/about/' | relative_url }}">关于</a><a class="nav-cta" href="{{ '/feed.xml' | relative_url }}">订阅 RSS ↗</a></nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="wrap footer"><div>KESION JOURNAL <span>Ideas, tools &amp; things worth making.</span></div><div><a href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a> · <a href="https://github.com/kesiondu/kesiondu.github.io">GitHub</a></div><p>© {{ site.time | date: '%Y' }} Kesion Journal · 关于 AI、产品与创作的独立记录。</p></footer>
</body>
</html>

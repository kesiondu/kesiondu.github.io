title: Kesion Journal
description: An independent blog on artificial intelligence, digital products, and creative work. In-depth perspectives, practical guides, and project notes.
url: https://kesiondu.github.io
baseurl: ""
lang: en
timezone: Asia/Shanghai
permalink: /notes/:title/
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude: [README.md, Gemfile, Gemfile.lock, exports]

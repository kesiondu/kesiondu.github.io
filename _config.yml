title: Kesion Journal
description: 关于人工智能、数字产品与创作实践的独立博客。分享深入观察、实用方法和项目笔记。
url: https://kesiondu.github.io
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
permalink: /notes/:title/
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude: [README.md, Gemfile, Gemfile.lock]
